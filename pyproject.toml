[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlt-glass"
version = "1.2.0"
description = "nlt-glass — a dark, fish-first GTK3+VTE terminal with a settings file, inbuilt plugins, real transparency, splits and the nlt chat sidecar (nlt optional)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["terminal", "fish", "gtk3", "vte", "nlt", "shell", "wayland", "x11"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.scripts]
nlt-glass = "nlt_glass.cli:main"

[tool.setuptools]
packages = ["nlt_glass", "nlt_glass.plugins"]
