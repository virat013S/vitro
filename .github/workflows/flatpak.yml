name: flatpak

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Sdk//48 org.gnome.Platform//48
      - name: Build the flatpak
        run: |
          flatpak-builder --force-clean --repo=repo build packaging/flatpak/io.github.virat013s.vitro.yml
          flatpak build-bundle repo vitro-${{ github.ref_name }}-x86_64.flatpak \
            io.github.virat013s.vitro --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: vitro-flatpak
          path: "*.flatpak"
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "vitro ${{ github.ref_name }}" \
            --notes "vitro ${{ github.ref_name }} — see README for install instructions." 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" *.flatpak --clobber
