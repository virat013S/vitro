name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q

  gtk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps (gtk3 + vte + pygobject→ system python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gir1.2-vte-2.91 python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: load the real bindings and build pieces
        run: |
          /usr/bin/python3 - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from nlt_glass import glass
          assert glass.READY, f"bindings failed: {glass.LOAD_ERROR}"
          from nlt_glass.palette import GLASS
          assert len(GLASS["normal"]) == 8
          print("gtk smoke ok — glass READY:", glass.READY)
          EOF
